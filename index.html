<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำนวณอายุครรภ์</title>
<meta name="theme-color" content="#e2728b">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3ef;--card:#fff;--ink:#3d2b2f;--muted:#8a7276;--pink:#e2728b;--pink-soft:#fde4ea;--line:#efdcd9;--accent:#5b8fd6;--ok:#3f9a6e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a1b;--card:#2a2325;--ink:#f3e7e9;--muted:#bba7ab;--pink:#f08aa1;--pink-soft:#4a2b33;--line:#3e3235;--accent:#86b2ee;--ok:#6cc99a}}
:root[data-theme="dark"]{--bg:#1f1a1b;--card:#2a2325;--ink:#f3e7e9;--muted:#bba7ab;--pink:#f08aa1;--pink-soft:#4a2b33;--line:#3e3235;--accent:#86b2ee;--ok:#6cc99a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,.mitr{font-family:Mitr,Sarabun,sans-serif;font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--pink);font-weight:600;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px}
.hero{display:flex;align-items:center;gap:18px;margin:6px 0 20px}
.hero svg{width:92px;flex:none}
.hero h1{margin:0;font-size:clamp(24px,5vw,34px)}
.hero p{margin:2px 0 0;color:var(--muted)}
.ref{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 8px;font:inherit;font-size:14.5px;cursor:pointer;text-align:center;line-height:1.3}
.tab b{display:block;font-family:Mitr,sans-serif;font-weight:500;color:var(--pink);font-size:15px}
.tab[aria-selected="true"]{background:var(--pink-soft);border-color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h2{margin:0 0 12px;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:70px}
input[type=number]{width:84px}
button.go{font:inherit;font-weight:600;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
.res{margin-top:18px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{background:var(--pink-soft);border-radius:14px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat strong{font-family:Mitr,sans-serif;font-weight:500;font-size:22px}
.prog{margin:16px 0 6px;height:14px;border-radius:999px;background:var(--line);position:relative;overflow:visible}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#f7b6c4,var(--pink))}
.prog em{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:20px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.err{color:#c4475f;margin-top:12px}
.tri{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;margin-top:10px}
.foot{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>
  <div class="hero">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fde4ea"/><circle cx="50" cy="34" r="12" fill="#fde3cf" stroke="#4a3a35" stroke-width="2.5"/><path d="M38 30q2-14 12-14t12 14q-6-6-12-6t-12 6z" fill="#5a3b2e"/><path d="M36 82l4-30q10-6 20 0l2 10q10 6 4 16q-4 6-12 4z" fill="#f7b6c4" stroke="#4a3a35" stroke-width="2.5" stroke-linejoin="round"/><path d="M58 66q6 0 6 6" fill="none" stroke="#e2728b" stroke-width="2"/></svg>
    <div><h1>คำนวณอายุครรภ์</h1><p>และวันกำหนดคลอด (EDC) แบบอัตโนมัติ</p></div>
  </div>

  <div class="ref">คำนวณ ณ วันที่ <span id="refBox"></span></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="1" aria-selected="true"><b>กรณีที่ 1</b>วันแรกของประจำเดือนครั้งสุดท้าย (LMP)</button>
    <button class="tab" role="tab" data-t="2" aria-selected="false"><b>กรณีที่ 2</b>รู้วันกำหนดคลอด</button>
    <button class="tab" role="tab" data-t="3" aria-selected="false"><b>กรณีที่ 3</b>รู้อายุครรภ์ปัจจุบัน</button>
  </div>

  <div class="card">
    <form id="f1" data-p="1"><h2>กรอกวันแรกที่ประจำเดือนมาครั้งสุดท้าย</h2><div class="row"><span id="d1"></span><button class="go">คำนวณ</button></div></form>
    <form id="f2" data-p="2" hidden><h2>กรอกวันกำหนดคลอด</h2><div class="row"><span id="d2"></span><button class="go">คำนวณ</button></div></form>
    <form id="f3" data-p="3" hidden><h2>กรอกอายุครรภ์ ณ วันที่คำนวณ</h2><div class="row"><label>สัปดาห์<input type="number" id="w3" min="0" max="44" inputmode="numeric" placeholder="เช่น 20"></label><label>วัน<select id="dd3"></select></label><button class="go">คำนวณ</button></div></form>
    <div class="res" id="res" aria-live="polite"></div>
  </div>
  <p class="foot">คำนวณตามกฎของ Naegele (LMP + 280 วัน) สมมติรอบเดือน 28 วัน ใช้ประกอบการตัดสินใจทางคลินิกเท่านั้น</p>
</div>
<script>
const TM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DAY=864e5,today=new Date();today.setHours(0,0,0,0);
function datePicker(host,id,def,yr0,yr1){
  const y=def.getFullYear();
  host.innerHTML=`<span class="row"><label>วันที่<select id="${id}d">${Array.from({length:31},(_,i)=>`<option ${i+1==def.getDate()?'selected':''}>${i+1}</option>`).join('')}</select></label>
  <label>เดือน<select id="${id}m">${TM.map((m,i)=>`<option value="${i}" ${i==def.getMonth()?'selected':''}>${m}</option>`).join('')}</select></label>
  <label>พ.ศ.<select id="${id}y">${Array.from({length:yr1-yr0+1},(_,i)=>yr0+i).map(v=>`<option value="${v}" ${v==y?'selected':''}>${v+543}</option>`).join('')}</select></label></span>`;}
function readDate(id){const d=+document.getElementById(id+'d').value,m=+document.getElementById(id+'m').value,y=+document.getElementById(id+'y').value;
  const r=new Date(y,m,d);return r.getMonth()===m?r:null;}
const Y=today.getFullYear();
datePicker(document.getElementById('refBox'),'r',today,Y-2,Y+2);
datePicker(document.getElementById('d1'),'a',new Date(today-140*DAY),Y-2,Y);
datePicker(document.getElementById('d2'),'b',new Date(+today+140*DAY),Y,Y+2);
document.getElementById('dd3').innerHTML=[0,1,2,3,4,5,6].map(i=>`<option>${i}</option>`).join('');
const fmt=d=>`${d.getDate()} ${TM[d.getMonth()]} ${d.getFullYear()+543}`;
const diff=(a,b)=>Math.round((b-a)/DAY);
function show(lmp,ref){
  const edc=new Date(+lmp+280*DAY),days=diff(lmp,ref),w=Math.floor(days/7),d=days-w*7,res=document.getElementById('res');
  if(days<0){res.innerHTML=`<p class="err">วันที่ที่กรอกอยู่หลังวันที่คำนวณ กรุณาตรวจสอบอีกครั้งค่ะ</p>`;return;}
  const left=diff(ref,edc),tri=w<14?'ไตรมาสที่ 1':w<28?'ไตรมาสที่ 2':'ไตรมาสที่ 3',pct=Math.min(100,days/280*100);
  res.innerHTML=`<div class="big">
   <div class="stat"><small>อายุครรภ์</small><strong>${w} สัปดาห์ ${d} วัน</strong></div>
   <div class="stat"><small>วันกำหนดคลอด (EDC)</small><strong>${fmt(edc)}</strong></div>
   <div class="stat"><small>LMP</small><strong>${fmt(lmp)}</strong></div>
   <div class="stat"><small>${left>=0?'อีกกี่วันถึงกำหนดคลอด':'เลยกำหนดคลอดมาแล้ว'}</small><strong>${Math.abs(left)} วัน</strong></div></div>
   <div class="prog"><i style="width:${pct}%"></i><em style="left:${pct}%">🤰</em></div><div class="ticks"><span>0</span><span>13</span><span>27</span><span>40 สัปดาห์</span></div>
   <span class="tri">${tri}</span>${w>=42?' <span class="tri">Post-term (≥ 42 สัปดาห์)</span>':w>=37?' <span class="tri">Term (37–41 สัปดาห์)</span>':w>=24?' <span class="tri">Preterm (< 37 สัปดาห์)</span>':''}
   <p class="note">ครบ 37 สัปดาห์: ${fmt(new Date(+lmp+259*DAY))} · ครบ 28 สัปดาห์: ${fmt(new Date(+lmp+196*DAY))}</p>`;}
function err(t){document.getElementById('res').innerHTML=`<p class="err">${t}</p>`;}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('form').forEach(f=>f.hidden=f.dataset.p!==b.dataset.t);document.getElementById('res').innerHTML='';});
f1.onsubmit=e=>{e.preventDefault();const ref=readDate('r'),l=readDate('a');if(!ref||!l)return err('วันที่ไม่ถูกต้อง (เช่น 31 ในเดือนที่มี 30 วัน)');show(l,ref);};
f2.onsubmit=e=>{e.preventDefault();const ref=readDate('r'),x=readDate('b');if(!ref||!x)return err('วันที่ไม่ถูกต้อง');show(new Date(+x-280*DAY),ref);};
f3.onsubmit=e=>{e.preventDefault();const ref=readDate('r'),w=parseInt(document.getElementById('w3').value),d=+document.getElementById('dd3').value;
  if(!ref||isNaN(w)||w<0||w>44)return err('กรุณากรอกจำนวนสัปดาห์ 0–44');show(new Date(+ref-(w*7+d)*DAY),ref);};
</script>
</body>
</html>
